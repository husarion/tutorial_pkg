# map_server and amcl are lifecycle nodes, but here nav2's own lifecycle_manager
# brings them up, so plain node tags are enough.
launch:
  - arg:
      name: use_sim_time
      default: "false"
      description: "Use simulation (Gazebo) clock if true"

  - arg:
      name: map_file
      default: "$(find-pkg-share tutorial_pkg)/maps/map.yaml"
      description: "Full path to the yaml map file"

  - arg:
      name: amcl_params_file
      default: "$(find-pkg-share tutorial_pkg)/config/amcl.yaml"
      description: "Full path to the parameters file for the amcl node"

  - node:
      pkg: nav2_map_server
      exec: map_server
      name: map_server
      param:
        - name: use_sim_time
          value: "$(var use_sim_time)"
        - name: yaml_filename
          value: "$(var map_file)"

  - node:
      pkg: nav2_amcl
      exec: amcl
      name: amcl
      param:
        - from: "$(var amcl_params_file)"
        - name: use_sim_time
          value: "$(var use_sim_time)"

  - node:
      pkg: nav2_lifecycle_manager
      exec: lifecycle_manager
      name: lifecycle_manager_localization
      param:
        - name: use_sim_time
          value: "$(var use_sim_time)"
        - name: autostart
          value: true
        - name: node_names
          value: [map_server, amcl]
